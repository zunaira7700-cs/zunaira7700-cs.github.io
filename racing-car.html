<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Zunaira Turbo Pro</title>
<style>
body{margin:0;background:#000;color:#fff;text-align:center;font-family:Arial;overflow:hidden}
#wrap{width:360px;max-width:100vw;height:600px;margin:auto;position:relative;background:#111;border:2px solid #00ff88;border-radius:12px;overflow:hidden}
canvas{width:100%;height:100%;display:block}
#ui{position:absolute;top:0;left:0;width:100%;display:flex;justify-content:space-between;padding:12px;box-sizing:border-box;z-index:5;font-weight:bold;color:#00ff88}
#controls{position:absolute;bottom:10px;left:0;width:100%;display:flex;justify-content:space-between;padding:10px 20px;box-sizing:border-box;z-index:5}
.btn{width:110px;height:110px;background:rgba(0,255,136,0.15);border:2px solid #00ff88;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;user-select:none;backdrop-filter:blur(5px)}
#center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);padding:25px;border-radius:20px;border:2px solid #00ff88;z-index:10;width:85%;text-align:center}
button{padding:14px 35px;background:#00ff88;border:none;border-radius:25px;font-weight:bold;font-size:18px;margin:5px}
.car-opt{padding:10px;margin:5px;border:2px solid #555;border-radius:10px;display:inline-block;cursor:pointer}
.car-opt.sel{border-color:#00ff88;background:rgba(0,255,136,0.2)}
</style>
</head>
<body>
<h2 style="color:#00ff88;margin:5px">ZUNAIRA TURBO PRO 🏁</h2>
<div id="wrap">
<div id="ui"><span id="score">SCORE: 0</span><span id="sp">0 KM/H</span></div>
<canvas id="g" width="360" height="600"></canvas>
<div id="controls"><div class="btn" id="L">◀</div><div class="btn" id="R">▶</div></div>
<div id="center">
<h3 style="margin:5px">Select Your Car</h3>
<div><div class="car-opt sel" data-c="#00ff88">🟩 Zunaira</div><div class="car-opt" data-c="#ff0040">🟥 Ferrari</div><div class="car-opt" data-c="#0090ff">🟦 Lambo</div></div>
<h3 id="msg" style="margin:15px 0 5px">READY?</h3>
<button id="play">START RACE</button>
</div>
</div>
<script>
let c=document.getElementById('g'),x=c.getContext('2d');
let s=document.getElementById('score'), sp=document.getElementById('sp');
let center=document.getElementById('center'), play=document.getElementById('play'), msg=document.getElementById('msg');
let px=160, score=0, speed=6, enemies=[], lines=[], keys={}, run=false, myColor='#00ff88';

for(let i=0;i<15;i++) lines.push({y:i*60});

document.querySelectorAll('.car-opt').forEach(o=>{
o.onclick=()=>{document.querySelectorAll('.car-opt').forEach(k=>k.classList.remove('sel'));o.classList.add('sel');myColor=o.dataset.c;}
});

function drawCar(xo,yo,color,enemy){
x.fillStyle=color; x.fillRect(xo+5,yo,30,55);
x.fillStyle='#000'; x.fillRect(xo+8,yo+5,24,15);
x.fillStyle='#222'; x.fillRect(xo,yo+8,5,15); x.fillRect(xo+35,yo+8,5,15);
x.fillRect(xo,yo+35,5,15); x.fillRect(xo+35,yo+35,5,15);
if(!enemy){ x.fillStyle='#fff'; x.font='8px Arial'; x.fillText('ZUN',xo+8,yo+35); }
}

function loop(){
if(!run) return;
if(keys.l) px-=7;
if(keys.r) px+=7;
if(px<35) px=35;
if(px>285) px=285;

for(let l of lines){ l.y+=speed; if(l.y>600) l.y=-60; }
if(Math.random()<0.04){
let pos=[40,110,180,250];
let cols=['#ff0040','#ffcc00','#0090ff','#ff00ff'];
enemies.push({x:pos[Math.floor(Math.random()*4)],y:-80,c:cols[Math.floor(Math.random()*4)]});
}
for(let i=enemies.length-1;i>=0;i--){
enemies[i].y+=speed;
if(enemies[i].y>650){ enemies.splice(i,1); score+=10; if(score%40==0) speed+=0.6; }
let e=enemies[i];
if(e && e.x<px+40 && e.x+40>px && e.y<500+60 && e.y+60>500){
run=false; center.style.display='block'; msg.innerText='CRASH! Score: '+score; play.innerText='RESTART';
if(navigator.vibrate) navigator.vibrate(200);
}
}
s.innerText='SCORE: '+score;
sp.innerText=Math.floor(speed*22)+' KM/H';
x.fillStyle='#0a0a0a'; x.fillRect(0,0,360,600);
x.fillStyle='#1a1a1a'; x.fillRect(35,0,290,600);
x.fillStyle='#fff';
for(let l of lines){ x.fillRect(35,l.y,6,30); x.fillRect(319,l.y,6,30); }
x.fillStyle='#ffff00'; x.fillRect(178,lines[0].y,4,30);
for(let e of enemies) drawCar(e.x,e.y,e.c,true);
drawCar(px,500,myColor,false);
requestAnimationFrame(loop);
}
play.onclick=()=>{px=160;score=0;speed=6;enemies=[];run=true;center.style.display='none';loop();};
let setK=(k,v)=>keys[k]=v;
document.getElementById('L').ontouchstart=e=>{e.preventDefault();setK('l',true)};document.getElementById('L').ontouchend=e=>{e.preventDefault();setK('l',false)};
document.getElementById('R').ontouchstart=e=>{e.preventDefault();setK('r',true)};document.getElementById('R').ontouchend=e=>{e.preventDefault();setK('r',false)};
document.getElementById('L').onmousedown=()=>setK('l',true);document.getElementById('L').onmouseup=()=>setK('l',false);
document.getElementById('R').onmousedown=()=>setK('r',true);document.getElementById('R').onmouseup=()=>setK('r',false);
window.onkeydown=e=>{if(e.key=='ArrowLeft')setK('l',true);if(e.key=='ArrowRight')setK('r',true);};
window.onkeyup=e=>{if(e.key=='ArrowLeft')setK('l',false);if(e.key=='ArrowRight')setK('r',false);};
</script>
</body>
</html>
