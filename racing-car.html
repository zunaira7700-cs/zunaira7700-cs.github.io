<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Racing - Zunaira</title>
<style>
body{margin:0;background:#000;color:#fff;text-align:center;font-family:Arial}
#wrap{width:360px;max-width:95vw;height:560px;margin:auto;position:relative;background:#222;border:2px solid #00ff88;border-radius:10px;overflow:hidden}
canvas{width:100%;height:100%;display:block}
#ui{position:absolute;top:0;left:0;width:100%;display:flex;justify-content:space-between;padding:10px;box-sizing:border-box;z-index:5}
#controls{position:absolute;bottom:0;left:0;width:100%;display:flex;justify-content:space-between;padding:10px;box-sizing:border-box;z-index:5}
.btn{width:100px;height:100px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:35px}
#center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#000;padding:20px;border-radius:15px;border:2px solid #00ff88;z-index:10;width:80%}
button{padding:12px 30px;background:#00ff88;border:none;border-radius:20px;font-weight:bold;font-size:16px}
</style>
</head>
<body>
<h2 style="color:#00ff88">ZUNAIRA TURBO RACING</h2>
<div id="wrap">
<div id="ui"><span id="score">0</span><span id="sp">0 KM/H</span></div>
<canvas id="g" width="360" height="560"></canvas>
<div id="controls"><div class="btn" id="L">◀</div><div class="btn" id="R">▶</div></div>
<div id="center"><h3>READY?</h3><button id="play">START</button></div>
</div>
<script>
let c=document.getElementById('g'),x=c.getContext('2d');
let s=document.getElementById('score'), sp=document.getElementById('sp');
let center=document.getElementById('center'), play=document.getElementById('play');
let px=160, score=0, speed=5, enemies=[], lines=[], keys={}, run=false, t;

for(let i=0;i<15;i++) lines.push({y:i*50});

function resetGame(){
px=160; score=0; speed=5; enemies=[];
}

function loop(){
if(!run) return;
if(keys.l) px-=6;
if(keys.r) px+=6;
if(px<10) px=10;
if(px>310) px=310;

for(let l of lines){ l.y+=speed; if(l.y>560) l.y=-50; }

if(Math.random()<0.03){
let pos=[40,120,200,280];
enemies.push({x:pos[Math.floor(Math.random()*4)],y:-80});
}

for(let i=enemies.length-1;i>=0;i--){
enemies[i].y+=speed;
if(enemies[i].y>600){ enemies.splice(i,1); score+=10; if(score%50==0) speed+=0.5; }
let e=enemies[i];
if(e && e.x<px+35 && e.x+40>px && e.y<480+60 && e.y+60>480){ run=false; center.style.display='block'; play.innerText='RESTART'; }
}

s.innerText='SCORE: '+score;
sp.innerText=Math.floor(speed*20)+' KM/H';

x.fillStyle='#333'; x.fillRect(0,0,360,560);
x.fillStyle='#444'; x.fillRect(30,0,300,560);
x.fillStyle='#fff';
for(let l of lines){ x.fillRect(30,l.y,8,25); x.fillRect(322,l.y,8,25); }

x.fillStyle='#ff0040';
for(let e of enemies){ x.fillRect(e.x,e.y,40,60); }

x.fillStyle='#00ff88';
x.fillRect(px,480,40,60);

t=requestAnimationFrame(loop);
}

play.onclick=()=>{ resetGame(); run=true; center.style.display='none'; loop(); };
document.getElementById('L').ontouchstart=()=>keys.l=true;
document.getElementById('L').ontouchend=()=>keys.l=false;
document.getElementById('R').ontouchstart=()=>keys.r=true;
document.getElementById('R').ontouchend=()=>keys.r=false;
document.getElementById('L').onmousedown=()=>keys.l=true;
document.getElementById('L').onmouseup=()=>keys.l=false;
document.getElementById('R').onmousedown=()=>keys.r=true;
document.getElementById('R').onmouseup=()=>keys.r=false;
window.onkeydown=e=>{ if(e.key=='ArrowLeft') keys.l=true; if(e.key=='ArrowRight') keys.r=true; };
window.onkeyup=e=>{ if(e.key=='ArrowLeft') keys.l=false; if(e.key=='ArrowRight') keys.r=false; };
</script>
</body>
</html>
